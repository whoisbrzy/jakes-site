<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><title>Jake — Admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:24px}.admin{position:relative;z-index:1;width:min(720px,100%);margin:30px auto;padding:28px;border:1px solid #ffffff18;border-radius:24px;background:#101522ef;backdrop-filter:blur(20px)}h1{margin-top:0}label{display:grid;gap:8px;margin:18px 0;color:#d6deef;font-size:14px}input,textarea{width:100%;padding:13px 14px;border:1px solid #ffffff20;border-radius:12px;background:#090e1b;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}button,.login{display:inline-block;padding:12px 18px;border:1px solid #8db5ff55;border-radius:12px;background:#234a9b;color:#fff;font:inherit;text-decoration:none;cursor:pointer}small,.hint{color:#929db3}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#notice{margin-top:14px;color:#9bd5ae}</style></head><body><main class="admin"><p class="eyebrow">JAKE / CONTROL ROOM</p><h1>Website settings</h1><p class="hint">Only Jake’s connected Discord account can access this panel.</p><div id="logged-out"><a class="login" href="/api/auth/discord">Continue with Discord</a></div><form id="editor" hidden><label>Bio<textarea name="bio" maxlength="500" required></textarea></label><label>GitHub profile URL<input name="github" type="url" required></label><label>Projects <small>JSON array: name, description, url.</small><textarea name="projects" placeholder='[{"name":"Project","description":"What it does","url":"https://..."}]'></textarea></label><label>Tech stack<input name="stack" maxlength="300"></label><label>Personal setup<textarea name="setup" maxlength="1000"></textarea></label><label>Music section text<textarea name="music" maxlength="500"></textarea></label><div class="row"><button type="submit">Save changes</button><button type="button" id="logout" class="login">Log out</button></div><p id="notice" role="status"></p></form></main><script src="admin.js"></script></body></html>
